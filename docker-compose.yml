services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mediai_mongo:/data/db
  api:
    build: .
    restart: unless-stopped
    depends_on: [mongo]
    ports: ["5000:5000"]
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/mediai_pro
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
volumes:
  mediai_mongo:
